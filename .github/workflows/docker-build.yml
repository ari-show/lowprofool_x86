name: Docker Image Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: |
        TAG=$(date +%Y-%m%d-%H-%M)
        docker build . --file Dockerfile --tag ghcr.io/shotaarima/lowprofool_x86-jupyter:${TAG}
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u shotaarima --password-stdin
        docker push ghcr.io/shotaarima/lowprofool_x86-jupyter:${TAG}
