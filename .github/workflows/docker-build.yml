name: Docker Image Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: |
        IMAGE="ghcr.io/ari-show/lowprofool_x86-jupyter:$(date +%Y-%m%d-%H-%M)"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        docker build . --file Dockerfile --tag "$IMAGE" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
    - name: Log in to GHCR
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_ACTOR: ${{ github.actor }}
      run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
    - name: Push the Docker image
      if: github.event_name == 'push'
      run: docker push "$IMAGE"
